    <div class="view-header"><h1>Accessibility training playground</h1></div>
    <p>Agent Studio is a small fake application for practising accessibility checks. This page explains what the playground is, gives a short primer on WCAG, lists the mistakes we see most often, and points to the material worth reading.</p>

    <h2 id="about">What this playground is</h2>
    <p>Agent Studio pretends to be a product for building chat agents. It has an agent list with search, a card and a table view, a form to create an agent, and dialogs for renaming and deleting. It exists in two versions that look the same but are built differently.</p>
    <p>The <a href="../accessible/">accessible version</a> is the reference: native HTML first, ARIA only where it adds something. The <a href="../broken/">seeded version</a> has deliberate accessibility bugs in the same screens. Nothing you enter is saved, and reloading a page restores the bugs. Fix one by editing the DOM in the developer tools, then check again. The plan for each session is in the <a href="../documentation/">documentation</a>.</p>

    <h2 id="wcag">WCAG in five minutes</h2>
    <p>The Web Content Accessibility Guidelines are the standard most laws and contracts point at. They are organised as four principles, each with guidelines, each with testable success criteria.</p>
    <h3>The four principles</h3>
    <ul>
      <li><strong>Perceivable.</strong> People can take the content in: images have text alternatives, colour is not the only signal, text has enough contrast.</li>
      <li><strong>Operable.</strong> People can work the interface: everything works with a keyboard, focus is visible and goes somewhere sensible, pages have titles.</li>
      <li><strong>Understandable.</strong> People can make sense of it: the language is set, controls are labelled, errors say what went wrong.</li>
      <li><strong>Robust.</strong> Assistive technology can read it: every control exposes a name, a role and a state.</li>
    </ul>
    <h3>Levels and versions</h3>
    <p>Each success criterion has a level. A is the minimum, AA is what is usually required, AAA is the stretch. WCAG 2.2 is the current version; 2.1 and 2.0 are subsets of it, so meeting 2.2 AA covers the older ones too.</p>
    <h3>Where to read it</h3>
    <ul>
      <li><a href="https://www.w3.org/TR/WCAG22/" target="_blank" rel="noopener">WCAG 2.2<span class="visually-hidden"> (opens in a new tab)</span><svg class="ext" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/></svg></a> is the standard itself. Dense, but authoritative.</li>
      <li><a href="https://www.w3.org/WAI/WCAG22/quickref/" target="_blank" rel="noopener">The Quick Reference<span class="visually-hidden"> (opens in a new tab)</span><svg class="ext" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/></svg></a> lets you filter the criteria by level and tag.</li>
      <li><a href="https://www.w3.org/WAI/WCAG22/Understanding/" target="_blank" rel="noopener">The Understanding documents<span class="visually-hidden"> (opens in a new tab)</span><svg class="ext" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/></svg></a> explain the intent of each criterion with examples and techniques. Start here when a criterion is unclear.</li>
    </ul>

    <h2 id="mistakes">Common mistakes developers make</h2>
    <p>These are the problems that turn up most often, taken from two published sources: the failures WebAIM finds year after year across the top million home pages, and the failure techniques the W3C documents under WCAG. The wording here is ours. In brackets are the success criterion each one fails and, where the W3C has written it up, the failure technique.</p>
    <h3>Semantics</h3>
    <ul>
      <li>A clickable <code>div</code> or <code>span</code> where a button or a link belongs. <span class="sc">(4.1.2, <a href="https://www.w3.org/WAI/WCAG22/Techniques/failures/F59">F59</a>)</span></li>
      <li>A link faked with script instead of a real link. <span class="sc">(2.1.1, <a href="https://www.w3.org/WAI/WCAG22/Techniques/failures/F42">F42</a>)</span></li>
      <li>An icon button, or an empty button, with no accessible name. <span class="sc">(4.1.2, <a href="https://www.w3.org/WAI/WCAG22/Techniques/failures/F68">F68</a>)</span></li>
      <li>A link that holds only an image with no alt text, so the link has no name either. <span class="sc">(2.4.4, <a href="https://www.w3.org/WAI/WCAG22/Techniques/failures/F89">F89</a>)</span></li>
      <li>A form field with no label at all. <span class="sc">(3.3.2, 4.1.2, <a href="https://www.w3.org/WAI/WCAG22/Techniques/failures/F68">F68</a>)</span></li>
      <li>A field with visible label text that is not connected to the field. <span class="sc">(1.3.1, <a href="https://www.w3.org/WAI/WCAG22/Techniques/failures/F111">F111</a>)</span></li>
      <li>Table headers marked up as ordinary cells. <span class="sc">(1.3.1, <a href="https://www.w3.org/WAI/WCAG22/Techniques/failures/F91">F91</a>)</span></li>
    </ul>
    <h3>Keyboard and focus</h3>
    <ul>
      <li>Controls that only react to mouse or touch events. <span class="sc">(2.1.1, <a href="https://www.w3.org/WAI/WCAG22/Techniques/failures/F54">F54</a>)</span></li>
      <li>The focus outline removed and nothing put in its place. <span class="sc">(2.4.7, <a href="https://www.w3.org/WAI/WCAG22/Techniques/failures/F78">F78</a>)</span></li>
      <li>Script that throws focus away as soon as a control receives it. <span class="sc">(2.1.1, 2.4.7, <a href="https://www.w3.org/WAI/WCAG22/Techniques/failures/F55">F55</a>)</span></li>
      <li>A positive <code>tabindex</code> that pulls one control out of the natural order. <span class="sc">(2.4.3, <a href="https://www.w3.org/WAI/WCAG22/Techniques/failures/F44">F44</a>)</span></li>
      <li>A dialog or menu that is not next to its trigger in the focus order. <span class="sc">(2.4.3, <a href="https://www.w3.org/WAI/WCAG22/Techniques/failures/F85">F85</a>)</span></li>
    </ul>
    <h3>Colour and contrast</h3>
    <ul>
      <li>Text with too little contrast against its background. <span class="sc">(1.4.3)</span></li>
      <li>Links told apart from the surrounding text by colour alone. <span class="sc">(1.4.1, <a href="https://www.w3.org/WAI/WCAG22/Techniques/failures/F73">F73</a>)</span></li>
      <li>Required or error fields marked by colour alone. <span class="sc">(1.4.1, <a href="https://www.w3.org/WAI/WCAG22/Techniques/failures/F81">F81</a>)</span></li>
    </ul>
    <h3>Content and feedback</h3>
    <ul>
      <li>Images with no alternative text. <span class="sc">(1.1.1, <a href="https://www.w3.org/WAI/WCAG22/Techniques/failures/F65">F65</a>)</span></li>
      <li>Link text such as “click here” or “more” that says nothing on its own. <span class="sc">(2.4.4, <a href="https://www.w3.org/WAI/WCAG22/Techniques/failures/F84">F84</a>)</span></li>
      <li>A page title that does not say what the page is. <span class="sc">(2.4.2, <a href="https://www.w3.org/WAI/WCAG22/Techniques/failures/F25">F25</a>)</span></li>
      <li>The page language not set, so screen readers guess the pronunciation. <span class="sc">(3.1.1)</span></li>
      <li>A new window or tab opened without the user asking for it. <span class="sc">(3.2.5, <a href="https://www.w3.org/WAI/WCAG22/Techniques/failures/F22">F22</a>)</span></li>
      <li>Search results, filters or saves that change the page without telling screen reader users. <span class="sc">(4.1.3, <a href="https://www.w3.org/WAI/WCAG22/Techniques/failures/F103">F103</a>)</span></li>
    </ul>
    <p>Sources: <a href="https://webaim.org/projects/million/" target="_blank" rel="noopener">The WebAIM Million<span class="visually-hidden"> (opens in a new tab)</span><svg class="ext" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/></svg></a> and the Failures section of <a href="https://www.w3.org/WAI/WCAG22/Techniques/#failures" target="_blank" rel="noopener">WCAG 2.2 Techniques<span class="visually-hidden"> (opens in a new tab)</span><svg class="ext" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/></svg></a>.</p>

    <h2 id="reading">Where to learn more</h2>
    <ul>
      <li><a href="https://www.w3.org/WAI/ARIA/apg/" target="_blank" rel="noopener">The ARIA Authoring Practices Guide<span class="visually-hidden"> (opens in a new tab)</span><svg class="ext" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/></svg></a> shows how to build common widgets with the right roles, states and keyboard behaviour. Read its "Read me first" page before copying a pattern.</li>
      <li><a href="https://www.w3.org/TR/html-aria/">ARIA in HTML</a> says which ARIA roles and attributes are allowed on which HTML elements.</li>
      <li><a href="https://www.w3.org/WAI/tutorials/" target="_blank" rel="noopener">The WAI tutorials<span class="visually-hidden"> (opens in a new tab)</span><svg class="ext" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/></svg></a> walk through images, forms, tables, menus and carousels.</li>
      <li><a href="https://developer.mozilla.org/en-US/docs/Web/Accessibility">MDN's accessibility section</a> is a good general reference for the HTML side.</li>
      <li>WCAG also exists in other languages. The authorised German translation is <a href="https://www.w3.org/Translations/WCAG20-de/" lang="de">Richtlinien für barrierefreie Webinhalte (WCAG) 2.0</a>.</li>
    </ul>

    <h2 id="toolkit">Testing toolkit</h2>
    <ul>
      <li><strong>Keyboard.</strong> Tab, Shift+Tab, Enter, Space, the arrows and Escape. The cheapest test and the one that finds the most.</li>
      <li><strong>Chrome DevTools.</strong> The <a href="https://developer.chrome.com/docs/devtools/accessibility/reference">Accessibility pane</a> in the Elements panel shows the name, the role and the state of the selected element, and how the name was computed.</li>
      <li><strong>axe DevTools.</strong> The <a href="https://www.deque.com/axe/devtools/">browser extension</a> finds the issues a machine can find. It will not find a clickable row with no keyboard path.</li>
      <li><strong>Bookmarklets.</strong> <a href="https://pauljadam.com/bookmarklets/">Paul J. Adam's bookmarklets</a> outline headings, landmarks and more without leaving the page.</li>
      <li><strong>ANDI.</strong> <a href="https://www.ssa.gov/accessibility/andi/help/install.html">ANDI</a>, the accessible name and description inspector, is a bookmarklet whose modules inspect focusable elements, links, structures, iframes and more, one at a time.</li>
      <li><strong>Screen readers.</strong> <a href="https://www.nvaccess.org/download/">NVDA</a> on Windows and <a href="https://support.apple.com/guide/voiceover/welcome/mac">VoiceOver</a> on macOS. Listen to a control in both versions and compare.</li>
    </ul>

    <h2 id="sessions">Sessions</h2>
    <p>The plan for each session and the mission participants get are in the <a href="../documentation/">documentation</a>.</p>
  </div>

        '<div class="segmented">' +
        '<button type="button"' + (state.view === 'card' ? ' class="selected"' : '') + ' data-view="card">' + ICON_GRID + 'Card</button>' +
        '<button type="button"' + (state.view === 'list' ? ' class="selected"' : '') + ' data-view="list">' + ICON_LIST + 'List</button>' +
        '</div>' +
        
        '<div class="toolbar-end">' +
        '<search class="search">' + ICON_SEARCH +
        '<label for="project-search" class="visually-hidden">Search Agents in your Project</label>' +
        '<input type="search" id="project-search" placeholder="Search Agents" autocomplete="off" value="' + esc(state.query) + '">' +
        '</search>' +
        
        (state.canCreate ? '<a class="btn btn-primary" href="#/agents/new">' + ICON_PLUS + 'New agent</a>'
          : '<button type="button" class="btn btn-primary" disabled aria-label="Add agent" aria-labelledby="agents-heading" title="You do not have permissions at the moment.">' + ICON_PLUS + 'New agent</button>') +
        
        '</div></div>' +
        projectList() };
    },
    project: function (p) {
      return { title: p.name, html:
        backButton('#/agents') +
        '<div class="view-header"><h1>' + esc(p.name) + '</h1></div>' +
        '<p class="muted">' + esc(p.description) + '</p>' +
        '<p>Nothing to configure here yet. This page exists so that each agent has somewhere to go.</p>' };
    },
    newAgent: function () {
      return { title: 'New agent', html:
        backButton('#/agents') +
        '<div class="view-header"><h1>New agent</h1></div>' +
        '<form id="new-agent-form">' +
        '<div class="field">' +
        
        '<span class="label">Agent name <span class="req">(required)</span></span>' +
        '<input name="agent-name" type="text" required autocomplete="off">' +
        
        '</div>' +
        '<div class="field"><label for="agent-description">Description</label>' +
        '<textarea id="agent-description" name="agent-description" rows="3"></textarea></div>' +
        '<div class="field"><label for="agent-language">Language</label>' +
        '<select id="agent-language" name="agent-language"><option>English</option><option>German</option><option>French</option><option>Spanish</option></select></div>' +
        '<div class="field field-switch">' +
        
        '<span class="label" id="enable-label">Enable agent</span>' +
        '<span class="switch" role="switch" tabindex="0" aria-labelledby="enable-label"><span class="switch-thumb"></span></span>' +
        
        '</div>' +
        '<div class="actions">' +
        '<button type="button" class="btn" data-route="#/agents">Cancel</button>' +
        '<button type="submit" class="btn btn-primary" aria-label="Close" tabindex="1">Create agent</button>' +
        '</div></form>' };
    },
    home: function () {
      return { title: 'Home', html: document.getElementById('home-content').innerHTML };
    },
    settings: function () {
      return { title: 'Settings', html: document.getElementById('settings-content').innerHTML };
    },
    simple: function (title, text, back) {
      return { title: title, html: (back ? backButton(back) : '') + '<div class="view-header"><h1>' + esc(title) + '</h1></div><p>' + text + '</p>' };
    }
  };

  var PAGES = { knowledge: 'Knowledge', endpoints: 'Endpoints' };
  var FOOTER_PAGES = {
    'privacy': { title: 'Privacy', text: 'A real product would explain here what it stores about you. The playground stores nothing: whatever you do here is gone when you reload.' },
    'terms': { title: 'Terms of use', text: 'Agent Studio is a fictional product. The playground exists for the Accessibility Champions training and has no terms beyond that.' },
    'accessibility': { title: 'Accessibility statement', text: 'The accessible version aims at WCAG 2.2 level AA. The seeded version deliberately does not. Tell the training team about anything you find in the accessible version.' }
  };
  var SETTINGS_PAGES = {
    'password': { title: 'Change password', text: 'Passwords cannot be changed in the playground. This page exists so that the link on the Settings page has somewhere to go.' },
    'two-factor': { title: 'Two-factor authentication', text: 'Two-factor authentication asks for a code from your phone as well as your password. It cannot be switched on in the playground.' },
    'session-timeout': { title: 'Session timeout', text: 'You are signed out after eight hours without activity. The timeout cannot be changed in the playground.' },
    'api-keys': { title: 'API keys', text: 'API keys let other systems call your agents. They cannot be managed in the playground.' }
  };
  function parseHash() {
    var hash = location.hash || '#/home';
    if (hash.indexOf('#/') !== 0) return null;
    return hash.slice(2).split('/').filter(Boolean);
  }
  function resolve(parts) {
    var section = parts[0];
    if (section === 'home') return views.home();
    if (section === 'agents') {
      if (parts.length === 1) return views.projects();
      if (parts[1] === 'new' && parts.length === 2) return views.newAgent();
      var project = findProject(parts[1]);
      if (!project) return views.simple('Not found', 'That project does not exist.');
      if (parts.length === 2) return views.project(project);
      return views.simple('Not found', 'That page does not exist.');
    }
    if (section === 'settings') {
      if (parts.length === 1) return views.settings();
      var page = parts.length === 2 && Object.prototype.hasOwnProperty.call(SETTINGS_PAGES, parts[1]) ? SETTINGS_PAGES[parts[1]] : null;
      if (page) return views.simple(page.title, page.text, '#/settings');
      return views.simple('Not found', 'That page does not exist.');
    }
    if (section === 'help') {
      return views.simple('Help', 'This is a training playground: a small fake application for practising accessibility checks with the keyboard, the browser developer tools, bookmarklets, axe DevTools and a screen reader. Nothing you enter here is saved.');
    }
    if (parts.length === 1 && Object.prototype.hasOwnProperty.call(FOOTER_PAGES, section)) {
      return views.simple(FOOTER_PAGES[section].title, FOOTER_PAGES[section].text);
    }
    if (PAGES[section]) {
      return views.simple(PAGES[section], 'Nothing to configure here. This area exists so that the sidebar has somewhere to go.');
    }
    return views.simple('Not found', 'That page does not exist.');
  }
  function updateNav(section) {
    var links = document.querySelectorAll('#main-nav a');
    for (var i = 0; i < links.length; i++) {
      if (links[i].getAttribute('href') === '#/' + section) links[i].setAttribute('aria-current', 'page');
      else links[i].removeAttribute('aria-current');
    }
  }
  function render(moveFocus) {
    var parts = parseHash();
    var anchor = null;
    if (!parts) {
      if (viewEl.children.length) return;
      parts = ['home'];
      anchor = location.hash.slice(1);
    }
    var result = resolve(parts);
    closePopover(false);
    viewEl.innerHTML = result.html;
    updateNav(parts[0]);
    document.getElementById('page-footer').hidden = parts[0] !== 'settings';
    if (anchor && document.getElementById(anchor)) document.getElementById(anchor).scrollIntoView();
  }
  function focusHeading() {
    var heading = viewEl.querySelector('h1');
    if (heading) {
      heading.setAttribute('tabindex', '-1');
      heading.focus();
    }
  }

  function toggleSwitch(sw) {
    var on = !sw.classList.contains('on');
    sw.classList.toggle('on', on);
  }
  function closePopover(returnFocus) {
    if (!openPopover) return;
    var current = openPopover;
    openPopover = null;
    current.panel.hidden = true;
  }
  function openMenu(button, focusLast) {
    var panel = button.nextElementSibling;
    closePopover(false);
    panel.hidden = false;
    openPopover = { panel: panel, button: button };
  }
  function togglePopover(button) {
    if (openPopover && openPopover.button === button) {
      closePopover(true);
      return;
    }
    openMenu(button, false);
  }

  function openModal(dialogEl, key) {
    var found = findItem(key);
    if (!found) return null;
    pending = { key: key, trigger: openPopover ? openPopover.button : null, dialog: dialogEl };
    closePopover(false);
    
    dialogEl.hidden = false;
    
    return found.item;
  }
  function closeModal() {
    if (!pending) return;
    var current = pending;
    
    pending = null;
    current.dialog.hidden = true;
  }
  function finishModal() {
    var current = pending;
    pending = null;
    
    current.dialog.hidden = true;
  }
  function askDelete(key) {
    var item = openModal(confirmDialog, key);
    if (item) document.getElementById('confirm-name').textContent = item.name;
  }
  function askRename(key) {
    var item = openModal(renameDialog, key);
    if (!item) return;
    renameInput.value = item.name;
  }
  function confirmDelete() {
    if (!pending) return;
    var key = pending.key;
    finishModal();
    deleteItem(key);
  }
  function renameItem(key, name) {
    var found = findItem(key);
    if (!found) return;
    found.item.name = name;
    found.item.editedDaysAgo = 0;
    found.item.editedAgo = 'just now';
    found.item.editedBy = 'You';
    closePopover(false);
    render(false);
  }
  function deleteItem(key) {
    var found = findItem(key);
    if (!found) return;

    found.list.splice(found.list.indexOf(found.item), 1);
    closePopover(false);
    render(false);
  }

  document.addEventListener('click', function (e) {
    if (e.target.closest('a[aria-disabled="true"]')) {
      e.preventDefault();
      return;
    }
    
    var fakeLink = e.target.closest('[role="link"][data-href]');
    if (fakeLink) {
      window.open(fakeLink.getAttribute('data-href'), '_blank', 'noopener');
      return;
    }
    
    var actions = e.target.closest('[data-actions]');
    if (actions) {
      e.preventDefault();
      togglePopover(actions);
      return;
    }
    var rename = e.target.closest('[data-rename]');
    if (rename) {
      e.preventDefault();
      askRename(rename.getAttribute('data-rename'));
      return;
    }
    var remove = e.target.closest('[data-delete]');
    if (remove) {
      e.preventDefault();
      askDelete(remove.getAttribute('data-delete'));
      return;
    }
    if (e.target.closest('[data-dialog-close]')) {
      closeModal();
      return;
    }
    if (e.target.closest('[data-confirm-delete]')) {
      confirmDelete();
      return;
    }
    if (openPopover) closePopover(false);
    var sortButton = e.target.closest('[data-sort]');
    if (sortButton) {
      setSort(sortButton.getAttribute('data-sort'));
      return;
    }

    var routed = e.target.closest('[data-route]');
    if (routed) {
      e.preventDefault();
      location.hash = routed.getAttribute('data-route');
      return;
    }
    if (e.target.closest('[data-refresh]')) {
      renderProjectList();
      return;
    }
    
    var viewButton = e.target.closest('[data-view]');
    if (viewButton) {
      setView(viewButton.getAttribute('data-view'));
      return;
    }
    
    var sw = e.target.closest('.switch');
    if (sw) toggleSwitch(sw);
  });

  function rearmTip(e) {
    var wrap = e.target.closest ? e.target.closest('.tip-wrap') : null;
    if (wrap && !wrap.contains(e.relatedTarget)) wrap.classList.remove('tip-dismissed');
  }
  viewEl.addEventListener('mouseout', rearmTip);
  viewEl.addEventListener('focusout', rearmTip);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      var tips = document.querySelectorAll('.tip-wrap:hover, .tip-wrap:focus-within');
      for (var t = 0; t < tips.length; t++) tips[t].classList.add('tip-dismissed');
    }
    if (e.key === 'Escape' && openPopover) {
      closePopover(true);
      return;
    }

    if (e.key === 'Enter' && e.target.matches('[role="link"][data-href]')) window.open(e.target.getAttribute('data-href'), '_blank', 'noopener');
    if (e.key === 'Escape' && pending) closeModal();
    if (e.key === 'Enter' && e.target.matches('tr[data-route]')) location.hash = e.target.getAttribute('data-route');
  });

  renameForm.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!pending) return;
    var key = pending.key, name = renameInput.value.trim();
    if (!name) return;
    finishModal();
    renameItem(key, name);
  });

  viewEl.addEventListener('input', function (e) {
    if (e.target.id !== 'project-search') return;
    state.query = e.target.value;
    renderProjectList();
  });

  viewEl.addEventListener('submit', function (e) {
    if (e.target.id !== 'new-agent-form') return;
    e.preventDefault();
    var form = e.target;
    var project = {
      id: state.nextProjectId++,
      name: form.elements['agent-name'].value.trim(),
      description: form.elements['agent-description'].value.trim() || 'No description yet.',
      language: form.elements['agent-language'].value,
      enabled: form.querySelector('.switch').classList.contains('on'),
      editedDaysAgo: 0, editedAgo: 'just now', editedBy: 'You'
    };
    state.projects.push(project);
    location.hash = '#/agents/' + project.id;
  });

  window.addEventListener('hashchange', function () { render(true); });
  render(false);
})();
</script>
</body>
</html>
