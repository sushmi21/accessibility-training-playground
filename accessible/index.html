<script>
(function () {
  'use strict';

  var APP_NAME = 'Agent Studio playground';

  var state = {
    nextProjectId: 3,
    nextAgentId: 2,
    projects: [
      { id: 1, name: 'Customer support bot',
        description: 'Answers customer questions about orders, returns and delivery times, and hands over to a human agent when it cannot help.',
        editedAgo: '4 months ago', editedBy: 'Alex_Dev',
        agents: [
          { id: 1, name: 'Order status helper', language: 'English', enabled: true,
            description: 'Answers questions about the status of an order. Asks for the order number first and never guesses.',
            editedAgo: '4 months ago', editedBy: 'Alex_Dev' }
        ] },
      { id: 2, name: 'Internal IT helpdesk',
        description: 'Resets passwords, unlocks accounts and creates tickets for everything else. Used by all employees from the intranet.',
        editedAgo: '2 days ago', editedBy: 'Jamie_Ops', agents: [] }
    ]
  };

  var ICON_BACK = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><polyline points="15 18 9 12 15 6"/></svg>';
  var ICON_PLUS = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
  var ICON_REFRESH = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>';
  var ICON_MORE = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="5" r="2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="2" fill="currentColor" stroke="none"/></svg>';

  var viewEl = document.getElementById('view');
  var dialog = document.getElementById('new-project-dialog');
  var newProjectButton = document.getElementById('new-project');
  var newProjectForm = document.getElementById('new-project-form');
  var projectNameInput = document.getElementById('project-name');
  var openPopover = null;

  function esc(value) {
    return String(value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function findProject(id) {
    return state.projects.filter(function (p) { return String(p.id) === String(id); })[0];
  }
  function findAgent(project, id) {
    return project.agents.filter(function (a) { return String(a.id) === String(id); })[0];
  }
  function findItem(key) {
    var parts = key.split(':');
    var project = findProject(parts[1]);
    if (!project) return null;
    if (parts[0] === 'project') return { item: project, list: state.projects };
    var agent = findAgent(project, parts[2]);
    return agent ? { item: agent, list: project.agents } : null;
  }
  function initials(name) {
    return name.split(/\s+/).filter(Boolean).slice(0, 2).map(function (word) { return word.charAt(0).toUpperCase(); }).join('');
  }
  function backButton(to) {
    return '<button type="button" class="btn-back" data-route="' + to + '">' + ICON_BACK + 'Back</button>';
  }

  function cardInner(item) {
    var panelId = 'actions-' + item.key.replace(/:/g, '-');
    return '<div class="card-body">' +
      '<span class="avatar" aria-hidden="true">' + esc(initials(item.name)) + '</span>' +
      '<div class="card-text">' +
      
      '<a class="card-title" href="' + item.href + '">' + esc(item.name) + '</a>' +
      
      '<p class="card-desc">' + esc(item.description) + '</p>' +
      '</div>' +
      '<div class="card-actions">' +
      
      '<button type="button" class="icon-btn" data-actions="' + item.key + '" aria-label="More actions for ' + esc(item.name) + '" aria-expanded="false" aria-controls="' + panelId + '">' + ICON_MORE + '</button>' +
      
      '<div class="popover" id="' + panelId + '" hidden>' +
      '<button type="button" data-rename="' + item.key + '">Rename</button>' +
      '<button type="button" class="danger" data-delete="' + item.key + '">Delete</button>' +
      '</div>' +
      '</div>' +
      '</div>' +
      '<div class="card-footer">' + esc(item.footer) + '</div>';
  }
  function cardList(items) {
    return '<ul class="cards">' + items.map(function (item) {
      
      return '<li class="card">' + cardInner(item) + '</li>';
    }).join('') + '</ul>';
  }
  function projectCards() {
    return cardList(state.projects.map(function (p) {
      return { key: 'project:' + p.id, href: '#/projects/' + p.id, name: p.name, description: p.description,
        footer: (p.agents.length === 1 ? '1 agent' : p.agents.length + ' agents') + ' · Last edited ' + p.editedAgo + ' by ' + p.editedBy };
    }));
  }
  function agentCards(p) {
    return cardList(p.agents.map(function (a) {
      return { key: 'agent:' + p.id + ':' + a.id, href: '#/projects/' + p.id + '/agents/' + a.id, name: a.name, description: a.description || 'No description yet.',
        footer: a.language + ' · ' + (a.enabled ? 'Enabled' : 'Disabled') + ' · Last edited ' + a.editedAgo + ' by ' + a.editedBy };
    }));
  }

  var views = {
    projects: function () {
      return { title: 'Projects', html:
        '<div class="view-header"><h1>Projects</h1>' +
        '<button type="button" class="icon-btn" data-refresh aria-label="Refresh project list">' + ICON_REFRESH + '</button></div>' +
        '<p class="muted">Pick a project or create a new one.</p>' +
        projectCards() };
    },
    project: function (p) {
      var agents = p.agents.length ? agentCards(p) : '<div class="empty"><p>No agents yet. Add the first one.</p></div>';
      var addRoute = '#/projects/' + p.id + '/agents/new';
      return { title: p.name, html:
        backButton('#/projects') +
        '<div class="view-header"><h1>' + esc(p.name) + '</h1></div>' +
        '<p class="muted">Agents in this project</p>' +
        agents +
        
        '<button type="button" class="btn btn-primary" data-route="' + addRoute + '">' + ICON_PLUS + 'Add Agent</button>'
      };
    },
    newAgent: function (p) {
      return { title: 'Add Agent', html:
        backButton('#/projects/' + p.id) +
        '<div class="view-header"><h1>Add Agent</h1></div>' +
        '<form id="add-agent-form" data-project="' + p.id + '">' +
        '<div class="field">' +
        
        '<label for="agent-name">Agent name <span class="req">(required)</span></label>' +
        '<input id="agent-name" name="agent-name" type="text" required autocomplete="off">' +
        
        '</div>' +
        '<div class="field"><label for="agent-language">Language</label>' +
        '<select id="agent-language" name="agent-language"><option>English</option><option>German</option><option>French</option><option>Spanish</option></select></div>' +
        '<div class="field"><label for="agent-description">Description</label>' +
        '<textarea id="agent-description" name="agent-description" rows="3"></textarea></div>' +
        '<div class="field field-switch">' +
        
        '<label for="enable-agent">Enable agent</label>' +
        '<button type="button" id="enable-agent" class="switch" role="switch" aria-checked="false"><span class="switch-thumb"></span></button>' +
        
        '</div>' +
        '<div class="actions">' +
        '<button type="button" class="btn" data-route="#/projects/' + p.id + '">Cancel</button>' +
        '<button type="submit" class="btn btn-primary">Save</button>' +
        '</div></form>' };
    },
    agent: function (p, a) {
      return { title: a.name, html:
        backButton('#/projects/' + p.id) +
        '<div class="view-header"><h1>' + esc(a.name) + '</h1></div>' +
        '<p class="muted">Agent in ' + esc(p.name) + '</p>' +
        '<dl><dt>Language</dt><dd>' + esc(a.language) + '</dd>' +
        '<dt>Description</dt><dd>' + (a.description ? esc(a.description) : '<span class="muted">None</span>') + '</dd>' +
        '<dt>Enabled</dt><dd>' + (a.enabled ? 'Yes' : 'No') + '</dd></dl>' };
    },
    simple: function (title, text) {
      return { title: title, html: '<div class="view-header"><h1>' + esc(title) + '</h1></div><p>' + text + '</p>' };
    }
  };

  function parseHash() {
    var hash = location.hash || '#/projects';
    if (hash.indexOf('#/') !== 0) return null;
    return hash.slice(2).split('/').filter(Boolean);
  }
  function resolve(parts) {
    var section = parts[0];
    if (section === 'projects') {
      if (parts.length === 1) return views.projects();
      var project = findProject(parts[1]);
      if (!project) return views.simple('Not found', 'That project does not exist.');
      if (parts.length === 2) return views.project(project);
      if (parts[2] === 'agents' && parts[3] === 'new') return views.newAgent(project);
      if (parts[2] === 'agents') {
        var agent = findAgent(project, parts[3]);
        if (agent) return views.agent(project, agent);
      }
      return views.simple('Not found', 'That page does not exist.');
    }
    if (section === 'help') {
      return views.simple('Help', 'This is a training playground: a small fake application for practising accessibility checks with the keyboard, the browser developer tools, bookmarklets, axe DevTools and a screen reader. Nothing you enter here is saved.');
    }
    if (section === 'knowledge' || section === 'endpoints' || section === 'settings') {
      return views.simple(section.charAt(0).toUpperCase() + section.slice(1), 'Nothing to configure here. This area exists so that the sidebar has somewhere to go.');
    }
    return views.simple('Not found', 'That page does not exist.');
  }
  function updateNav(section) {
    var links = document.querySelectorAll('#main-nav a');
    for (var i = 0; i < links.length; i++) {
      if (links[i].getAttribute('href') === '#/' + section) links[i].setAttribute('aria-current', 'page');
      else links[i].removeAttribute('aria-current');
    }
  }
  function render(moveFocus) {
    var parts = parseHash();
    if (!parts) return;
    var result = resolve(parts);
    openPopover = null;
    viewEl.innerHTML = result.html;
    updateNav(parts[0]);
    
    document.title = result.title + ' – ' + APP_NAME;
    if (moveFocus) focusHeading();
  }
  function focusHeading() {
    var heading = viewEl.querySelector('h1');
    if (heading) {
      heading.setAttribute('tabindex', '-1');
      heading.focus();
    }
  }

  function openDialog() {
    
    dialog.showModal();
  }
  function closeDialog() {
    
    dialog.close();
  }
  function toggleSwitch(sw) {
    var on = !sw.classList.contains('on');
    sw.classList.toggle('on', on);
    
    sw.setAttribute('aria-checked', on ? 'true' : 'false');
  }

  function closePopover(returnFocus) {
    if (!openPopover) return;
    var current = openPopover;
    openPopover = null;
    current.panel.hidden = true;
    
    current.button.setAttribute('aria-expanded', 'false');
    if (returnFocus) current.button.focus();
  }
  function togglePopover(button) {
    var panel = button.nextElementSibling;
    if (openPopover && openPopover.panel === panel) {
      closePopover(true);
      return;
    }
    closePopover(false);
    panel.hidden = false;
    openPopover = { panel: panel, button: button };
    
    button.setAttribute('aria-expanded', 'true');
    panel.querySelector('button').focus();
  }
  function renameItem(key) {
    var found = findItem(key);
    if (!found) return;
    var name = window.prompt('New name', found.item.name);
    if (!name || !name.trim()) {
      closePopover(true);
      return;
    }
    found.item.name = name.trim();
    found.item.editedAgo = 'just now';
    found.item.editedBy = 'You';
    closePopover(false);
    render(false);
    
    var button = viewEl.querySelector('[data-actions="' + key + '"]');
    if (button) button.closest('.card').querySelector('.card-title').focus();
  }
  function deleteItem(key) {
    var found = findItem(key);
    if (!found) return;
    var index = found.list.indexOf(found.item);
    found.list.splice(index, 1);
    closePopover(false);
    render(false);
    
    var titles = viewEl.querySelectorAll('.card-title');
    var next = titles[Math.min(index, titles.length - 1)];
    if (next) next.focus(); else focusHeading();
  }

  document.addEventListener('click', function (e) {
    var actions = e.target.closest('[data-actions]');
    if (actions) {
      e.preventDefault();
      togglePopover(actions);
      return;
    }
    var rename = e.target.closest('[data-rename]');
    if (rename) {
      e.preventDefault();
      renameItem(rename.getAttribute('data-rename'));
      return;
    }
    var remove = e.target.closest('[data-delete]');
    if (remove) {
      e.preventDefault();
      deleteItem(remove.getAttribute('data-delete'));
      return;
    }
    if (openPopover) closePopover(false);
    var routed = e.target.closest('[data-route]');
    if (routed) {
      e.preventDefault();
      location.hash = routed.getAttribute('data-route');
      return;
    }
    if (e.target.closest('[data-refresh]')) {
      var list = viewEl.querySelector('.cards');
      if (list) list.outerHTML = projectCards();
      return;
    }
    var sw = e.target.closest('.switch');
    if (sw) {
      toggleSwitch(sw);
      return;
    }
    if (e.target.closest('[data-close]')) closeDialog();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && openPopover) {
      closePopover(true);
      return;
    }
  });

  viewEl.addEventListener('submit', function (e) {
    if (e.target.id !== 'add-agent-form') return;
    e.preventDefault();
    var form = e.target;
    var project = findProject(form.getAttribute('data-project'));
    if (!project) return;
    var agent = {
      id: state.nextAgentId++,
      name: form.elements['agent-name'].value.trim(),
      language: form.elements['agent-language'].value,
      description: form.elements['agent-description'].value.trim(),
      enabled: form.querySelector('.switch').classList.contains('on'),
      editedAgo: 'just now',
      editedBy: 'You'
    };
    project.agents.push(agent);
    location.hash = '#/projects/' + project.id + '/agents/' + agent.id;
  });

  newProjectForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var project = { id: state.nextProjectId++, name: projectNameInput.value.trim(), description: 'No description yet.', editedAgo: 'just now', editedBy: 'You', agents: [] };
    state.projects.push(project);
    newProjectForm.reset();
    closeDialog();
    location.hash = '#/projects/' + project.id;
  });

  newProjectButton.addEventListener('click', openDialog);
  
  document.getElementById('skip-link').addEventListener('click', function (e) {
    e.preventDefault();
    document.getElementById('main').focus();
  });

  window.addEventListener('hashchange', function () { render(true); });
  render(false);
})();
</script>
</body>
</html>
