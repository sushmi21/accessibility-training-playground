      '<p class="card-desc">' + esc(item.description) + '</p>' +
      '</div>' +
      actionsMenu(item) +
      '</div>' +
      '<div class="card-footer">' + esc(item.footer) + '</div>';
  }
  function cardList(items) {
    return '<ul class="cards">' + items.map(function (item) {
      /*IF BROKEN*/
      return '<a class="card" href="' + item.href + '">' + cardInner(item) + '</a>';
      /*ELSE*/
      return '<li class="card" data-item>' + cardInner(item) + '</li>';
      /*ENDIF*/
    }).join('') + '</ul>';
  }
  function filteredProjects() {
    var q = state.query.trim().toLowerCase();
    var list = !q ? state.projects : state.projects.filter(function (p) {
      return (p.name + ' ' + p.description).toLowerCase().indexOf(q) !== -1;
    });
    var sort = state.sort;
    if (!sort) return list;
    return list.slice().sort(function (a, b) {
      var result = sort.key === 'name' ? a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }) : b.editedDaysAgo - a.editedDaysAgo;
      return sort.dir === 'asc' ? result : -result;
    });
  }
  function projectCards(projects) {
    return cardList(projects.map(function (p) {
      return { key: 'project:' + p.id, href: '#/agents/' + p.id, name: p.name, description: p.description,
        footer: 'Last edited ' + p.editedAgo + ' by ' + p.editedBy };
    }));
  }
  function sortHeader(key, label, cls) {
    var active = state.sort && state.sort.key === key;
    var icon = !active ? ICON_SORT : (state.sort.dir === 'asc' ? ICON_SORT_UP : ICON_SORT_DOWN);
    return '<th scope="col" class="' + cls + (active ? ' sorted' : '') + '"' +
      /*IF BROKEN*/
      /*ELSE*/
      (active ? ' aria-sort="' + (state.sort.dir === 'asc' ? 'ascending' : 'descending') + '"' : '') +
      /*ENDIF*/
      '><button type="button" class="sort" data-sort="' + key + '">' + label + icon + '</button></th>';
  }
  function projectRow(p) {
    var key = 'project:' + p.id, href = '#/agents/' + p.id;
    return (
      /*IF BROKEN*/
      '<tr role="link" tabindex="0" data-route="' + href + '">' +
      '<td class="cell-name"><span class="name-wrap"><span class="avatar" aria-hidden="true">' + esc(initials(p.name)) + '</span>' +
      '<span class="row-title">' + esc(p.name) + '</span></span></td>' +
      /*ELSE*/
      '<tr data-project="' + p.id + '" data-item>' +
      '<td class="cell-name"><span class="name-wrap"><span class="avatar" aria-hidden="true">' + esc(initials(p.name)) + '</span>' +
      '<a class="row-title" data-title href="' + href + '">' + esc(p.name) + '</a></span></td>' +
      /*ENDIF*/
      '<td class="cell-desc">' + esc(p.description) + '</td>' +
      '<td class="cell-edited">' + esc(p.editedAgo + ' by ' + p.editedBy) + '</td>' +
      '<td class="cell-actions">' + actionsMenu({ key: key, name: p.name }) + '</td>' +
      '</tr>');
  }
  function projectTable(projects) {
    return '<div class="table-wrap"><table class="table">' +
      '<caption class="visually-hidden">Projects</caption>' +
      '<thead><tr>' +
      sortHeader('name', 'Name', 'col-name') +
      '<th scope="col" class="col-desc">Description</th>' +
      sortHeader('edited', 'Last edited', 'col-edited') +
      '<th scope="col" class="col-actions"><span class="visually-hidden">Actions</span></th>' +
      '</tr></thead><tbody>' +
      projects.map(projectRow).join('') +
      '</tbody></table></div>';
  }
  function projectListInner() {
    var projects = filteredProjects();
    if (!projects.length) return '<div class="empty"><p>No projects match “' + esc(state.query.trim()) + '”.</p></div>';
    return state.view === 'list' ? projectTable(projects) : projectCards(projects);
  }
  function projectList() {
    return '<div id="project-list" class="project-list ' + state.view + '-view">' + projectListInner() + '</div>';
  }
  function renderProjectList() {
    var wrapper = document.getElementById('project-list');
    if (!wrapper) return;
    closePopover(false);
    wrapper.className = 'project-list ' + state.view + '-view';
    wrapper.innerHTML = projectListInner();
  }
  function setView(view) {
    state.view = view;
    renderProjectList();
    /*IF BROKEN*/
    var buttons = viewEl.querySelectorAll('[data-view]');
    for (var i = 0; i < buttons.length; i++) buttons[i].classList.toggle('selected', buttons[i].getAttribute('data-view') === view);
    /*ENDIF*/
  }
  function setSort(key) {
    var dir = state.sort && state.sort.key === key ? (state.sort.dir === 'asc' ? 'desc' : 'asc') : (key === 'edited' ? 'desc' : 'asc');
    state.sort = { key: key, dir: dir };
    renderProjectList();
    var button = viewEl.querySelector('[data-sort="' + key + '"]');
    if (button) button.focus();
    /*IF BROKEN*/
    /*ELSE*/
    announce(key === 'name' ? 'Sorted by Name, ' + (dir === 'asc' ? 'A to Z' : 'Z to A') : 'Sorted by Last edited, ' + (dir === 'desc' ? 'newest first' : 'oldest first'));
    /*ENDIF*/
  }
  function searchStatus() {
    var q = state.query.trim();
    var count = filteredProjects().length;
    if (!q) return 'Showing all ' + count + (count === 1 ? ' project' : ' projects');
    if (!count) return 'No projects match \u201c' + q + '\u201d';
    return count === 1 ? '1 project matches' : count + ' projects match';
  }
  /*IF BROKEN*/
  /*ELSE*/
  function announce(text) {
    if (text === lastAnnounced) return;
    lastAnnounced = text;
    statusEl.textContent = text;
  }
  /*ENDIF*/
  function avatarSrc(persona) {
    return 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48"><rect width="48" height="48" rx="10" fill="' + persona.color + '"/><text x="24" y="30" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">' + initials(persona.name) + '</text></svg>');
  }
  function personaCard(project, persona, index) {
    var id = 'persona-' + persona.id;
    var checked = project.persona === persona.id;
    var details = '<div class="persona-details" id="' + id + '-details">' +
      '<p class="persona-sub">Speaking style</p>' +
      '<p class="chips"><span class="chip">Voice: ' + esc(persona.voice) + '</span><span class="chip">Language: ' + esc(persona.language) + '</span></p>' +
      '<div class="stats"><div class="stat"><strong>' + persona.agents + '</strong><span>Agents using this persona</span></div>' +
      '<div class="stat"><strong>' + persona.scenarios + '</strong><span>Active test scenarios</span></div></div></div>';
    /*IF BROKEN*/
    return '<div class="persona-card' + (checked ? ' selected' : '') + '" role="radio" aria-checked="' + checked + '" tabindex="0" aria-labelledby="' + id + '-name" aria-describedby="' + id + '-desc ' + id + '-details" data-persona="' + persona.id + '">' +
      '<div class="persona-head"><img class="persona-avatar" src="' + avatarSrc(persona) + '" alt="" width="48" height="48">' +
      '<div class="persona-title"><span class="persona-name" id="' + id + '-name">' + esc(persona.name) + '</span>' +
      '<p class="persona-desc" id="' + id + '-desc">' + esc(persona.description) + '</p></div>' +
      '<span class="persona-radio" aria-hidden="true"></span></div>' + details + '</div>';
    /*ELSE*/
    return '<div class="persona-card">' +
      '<input type="radio" class="visually-hidden" name="persona" id="' + id + '" value="' + persona.id + '" aria-describedby="' + id + '-desc ' + id + '-details"' + (checked ? ' checked' : '') + '>' +
      '<div class="persona-head"><img class="persona-avatar" src="' + avatarSrc(persona) + '" alt="" width="48" height="48">' +
      '<div class="persona-title"><label class="persona-name" for="' + id + '">' + esc(persona.name) + '</label>' +
      '<p class="persona-desc" id="' + id + '-desc">' + esc(persona.description) + '</p></div>' +
      '<span class="persona-radio" aria-hidden="true"></span></div>' + details + '</div>';
    /*ENDIF*/
  }
  function personaSection(project) {
    var cards = state.personas.map(function (persona, index) { return personaCard(project, persona, index); }).join('');
    /*IF BROKEN*/
    return '<div class="personas"><h2 id="persona-heading">Persona</h2>' +
      '<p class="muted" id="persona-hint">Choose the persona this agent speaks with. One persona per agent.</p>' +
      '<div class="persona-grid" role="radiogroup" aria-labelledby="persona-heading" aria-describedby="persona-hint">' + cards + '</div></div>';
    /*ELSE*/
    return '<fieldset class="personas"><legend><h2>Persona</h2></legend>' +
      '<p class="muted">Choose the persona this agent speaks with. One persona per agent.</p>' +
      '<div class="persona-grid">' + cards + '</div></fieldset>';
    /*ENDIF*/
  }

  var views = {
    projects: function () {
      return { title: 'Agents', html:
        '<div class="view-header"><h1>Agents</h1>' +
        '<button type="button" class="icon-btn" data-refresh {{broken:|accessible:aria-label="Refresh project list"}}>' + ICON_REFRESH + '</button></div>' +
        '<p class="muted">Pick a project or create a new one.</p>' +
        '<div class="toolbar">' +
        /*IF BROKEN*/
        '<div class="segmented">' +
        '<button type="button"' + (state.view === 'card' ? ' class="selected"' : '') + ' data-view="card">' + ICON_GRID + 'Card</button>' +
        '<button type="button"' + (state.view === 'list' ? ' class="selected"' : '') + ' data-view="list">' + ICON_LIST + 'List</button>' +
        '</div>' +
        /*ELSE*/
        '<fieldset class="segmented"><legend class="visually-hidden">View</legend>' +
        '<input type="radio" name="view" id="view-card" value="card" class="visually-hidden"' + (state.view === 'card' ? ' checked' : '') + '>' +
        '<label for="view-card">' + ICON_GRID + 'Card</label>' +
        '<input type="radio" name="view" id="view-list" value="list" class="visually-hidden"' + (state.view === 'list' ? ' checked' : '') + '>' +
        '<label for="view-list">' + ICON_LIST + 'List</label>' +
        '</fieldset>' +
        /*ENDIF*/
        '<div class="toolbar-end">' +
        '<search class="search">' + ICON_SEARCH +
        '<label for="project-search" class="visually-hidden">Search projects</label>' +
        '<input type="search" id="project-search" placeholder="Search projects" autocomplete="off" value="' + esc(state.query) + '">' +
        '</search>' +
        '<button type="button" class="btn btn-primary" data-new-project>' + ICON_PLUS + 'New agent</button>' +
        '</div></div>' +
        projectList() };
    },
    project: function (p) {
      return { title: p.name, html:
        backButton('#/agents') +
        '<div class="view-header"><h1>' + esc(p.name) + '</h1></div>' +
        '<p class="muted">' + esc(p.description) + '</p>' +
        personaSection(p) };
    },
    simple: function (title, text) {
      return { title: title, html: '<div class="view-header"><h1>' + esc(title) + '</h1></div><p>' + text + '</p>' };
    }
  };

  var PAGES = { knowledge: 'Knowledge', endpoints: 'Endpoints', settings: 'Settings' };
  function parseHash() {
    var hash = location.hash || '#/agents';
    if (hash.indexOf('#/') !== 0) return null;
    return hash.slice(2).split('/').filter(Boolean);
  }
  function resolve(parts) {
    var section = parts[0];
    if (section === 'agents') {
      if (parts.length === 1) return views.projects();
      var project = findProject(parts[1]);
      if (!project) return views.simple('Not found', 'That project does not exist.');
      if (parts.length === 2) return views.project(project);
      return views.simple('Not found', 'That page does not exist.');
    }
    if (section === 'help') {
      return views.simple('Help', 'This is a training playground: a small fake application for practising accessibility checks with the keyboard, the browser developer tools, bookmarklets, axe DevTools and a screen reader. Nothing you enter here is saved.');
    }
    if (PAGES[section]) {
      return views.simple(PAGES[section], 'Nothing to configure here. This area exists so that the sidebar has somewhere to go.');
    }
    return views.simple('Not found', 'That page does not exist.');
  }
  function updateNav(section) {
    var links = document.querySelectorAll('#main-nav a');
    for (var i = 0; i < links.length; i++) {
      if (links[i].getAttribute('href') === '#/' + section) links[i].setAttribute('aria-current', 'page');
      else links[i].removeAttribute('aria-current');
    }
  }
  function render(moveFocus) {
    var parts = parseHash();
    if (!parts) return;
    var result = resolve(parts);
    closePopover(false);
    viewEl.innerHTML = result.html;
    updateNav(parts[0]);
    /*IF BROKEN*/
    /*ELSE*/
    clearTimeout(announceTimer);
    lastAnnounced = '';
    statusEl.textContent = '';
    document.title = result.title + ' – ' + APP_NAME;
    if (moveFocus) focusHeading();
    /*ENDIF*/
  }
  function focusHeading() {
    var heading = viewEl.querySelector('h1');
    if (heading) {
      heading.setAttribute('tabindex', '-1');
      heading.focus();
    }
  }

  function openDialog() {
    /*IF BROKEN*/
    dialog.hidden = false;
    /*ELSE*/
    dialog.showModal();
    /*ENDIF*/
  }
  function closeDialog() {
    /*IF BROKEN*/
    dialog.hidden = true;
    /*ELSE*/
    dialog.close();
    /*ENDIF*/
  }
  function closePopover(returnFocus) {
    if (!openPopover) return;
    var current = openPopover;
    openPopover = null;
    current.panel.hidden = true;
    /*IF BROKEN*/
    /*ELSE*/
    current.button.setAttribute('aria-expanded', 'false');
    if (returnFocus) current.button.focus();
    /*ENDIF*/
  }
  function togglePopover(button) {
    var panel = button.nextElementSibling;
    if (openPopover && openPopover.panel === panel) {
      closePopover(true);
      return;
    }
    closePopover(false);
    panel.hidden = false;
    openPopover = { panel: panel, button: button };
    /*IF BROKEN*/
    /*ELSE*/
    button.setAttribute('aria-expanded', 'true');
    panel.querySelector('button, a').focus();
    /*ENDIF*/
  }
  function renameItem(key) {
    var found = findItem(key);
    if (!found) return;
    var name = window.prompt('New name', found.item.name);
    if (!name || !name.trim()) {
      closePopover(true);
      return;
    }
    found.item.name = name.trim();
    found.item.editedDaysAgo = 0;
    found.item.editedAgo = 'just now';
    found.item.editedBy = 'You';
    closePopover(false);
    render(false);
    /*IF BROKEN*/
    /*ELSE*/
    var button = viewEl.querySelector('[data-actions="' + key + '"]');
    if (button) button.closest('[data-item]').querySelector('[data-title]').focus();
    /*ENDIF*/
  }
  function deleteItem(key) {
    var found = findItem(key);
    if (!found) return;
    /*IF BROKEN*/
    /*ELSE*/
    var items = Array.prototype.slice.call(viewEl.querySelectorAll('[data-item]'));
    var position = items.indexOf(viewEl.querySelector('[data-actions="' + key + '"]').closest('[data-item]'));
    /*ENDIF*/
    found.list.splice(found.list.indexOf(found.item), 1);
    closePopover(false);
    render(false);
    /*IF BROKEN*/
    /*ELSE*/
    var titles = viewEl.querySelectorAll('[data-title]');
    var next = titles[Math.min(position, titles.length - 1)];
    if (next) next.focus(); else focusHeading();
    /*ENDIF*/
  }

  document.addEventListener('click', function (e) {
    var actions = e.target.closest('[data-actions]');
    if (actions) {
      e.preventDefault();
      togglePopover(actions);
      return;
    }
    var rename = e.target.closest('[data-rename]');
    if (rename) {
      e.preventDefault();
      renameItem(rename.getAttribute('data-rename'));
      return;
    }
    var remove = e.target.closest('[data-delete]');
    if (remove) {
      e.preventDefault();
      deleteItem(remove.getAttribute('data-delete'));
      return;
    }
    if (openPopover) closePopover(false);
    var sortButton = e.target.closest('[data-sort]');
    if (sortButton) {
      setSort(sortButton.getAttribute('data-sort'));
      return;
    }
    /*IF BROKEN*/
    /*ELSE*/
    var row = e.target.closest('tr[data-project]');
    if (row) {
      if (e.target.closest('a, button') || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey || String(window.getSelection())) return;
      row.querySelector('[data-title]').click();
      return;
    }
    /*ENDIF*/
    /*IF BROKEN*/
    var personaRadio = e.target.closest('[role="radio"][data-persona]');
    if (personaRadio) {
      selectPersona(personaRadio);
      return;
    }
    /*ENDIF*/
    var routed = e.target.closest('[data-route]');
    if (routed) {
      e.preventDefault();
      location.hash = routed.getAttribute('data-route');
      return;
    }
    if (e.target.closest('[data-refresh]')) {
      renderProjectList();
      return;
    }
    if (e.target.closest('[data-new-project]')) {
      openDialog();
      return;
    }
    /*IF BROKEN*/
    var viewButton = e.target.closest('[data-view]');
    if (viewButton) {
      setView(viewButton.getAttribute('data-view'));
      return;
    }
    /*ENDIF*/
    if (e.target.closest('[data-close]')) closeDialog();
  });

  /*IF BROKEN*/
  function selectPersona(card) {
    var project = findProject(parseHash()[1]);
    var radios = card.parentNode.querySelectorAll('[role="radio"]');
    for (var i = 0; i < radios.length; i++) radios[i].classList.toggle('selected', radios[i] === card);
    if (project) project.persona = card.getAttribute('data-persona');
  }
  /*ENDIF*/
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && openPopover) {
      closePopover(true);
      return;
    }
    /*IF BROKEN*/
    if (e.key === 'Escape' && !dialog.hidden) closeDialog();
    if (e.key === 'Enter' && e.target.matches('tr[data-route]')) location.hash = e.target.getAttribute('data-route');
    /*ENDIF*/
  });
  /*IF BROKEN*/
  /*ELSE*/
  dialog.addEventListener('keydown', function (e) {
    if (e.key !== 'Tab') return;
    var items = dialog.querySelectorAll('button, input, select, textarea, [href], [tabindex]:not([tabindex="-1"])');
    var first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  /*ENDIF*/

  viewEl.addEventListener('input', function (e) {
    if (e.target.id !== 'project-search') return;
    state.query = e.target.value;
    renderProjectList();
    /*IF BROKEN*/
    /*ELSE*/
    clearTimeout(announceTimer);
    announceTimer = setTimeout(function () { announce(searchStatus()); }, 500);
    /*ENDIF*/
  });
  /*IF BROKEN*/
  /*ELSE*/
  viewEl.addEventListener('change', function (e) {
    if (e.target.name === 'view') setView(e.target.value);
    if (e.target.name === 'persona') {
      var project = findProject(parseHash()[1]);
      if (project) project.persona = e.target.value;
    }
  });
  /*ENDIF*/

  newProjectForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var project = { id: state.nextProjectId++, name: projectNameInput.value.trim(), description: 'No description yet.', editedDaysAgo: 0, editedAgo: 'just now', editedBy: 'You' };
    state.projects.push(project);
    newProjectForm.reset();
    closeDialog();
    location.hash = '#/agents/' + project.id;
  });

  /*IF BROKEN*/
  /*ELSE*/
  document.getElementById('skip-link').addEventListener('click', function (e) {
    e.preventDefault();
    document.getElementById('main').focus();
  });
  /*ENDIF*/

  window.addEventListener('hashchange', function () { render(true); });
  render(false);
})();
</script>
</body>
</html>
